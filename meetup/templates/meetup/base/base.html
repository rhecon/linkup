{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Meetups!{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'meetup/styles/base.css' %}">
    {% block site_css %}{% endblock %}
</head>
<body>
    <header id="main-header">
      <nav><a href="/meetups" id="main-logo">DjangoMeetups</a></nav>
      <h1>{% block main_heading %}{% endblock %}</h1>
      <p>{% block header_content %}{% endblock %}</p>
    </header>

    {% comment %} <h2>{{ meetups.0.title }}</h2> {% endcomment %}

    <main>
        {% block body %}{% endblock %}
    </main>
</body>
</html>
